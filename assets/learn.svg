<svg xmlns="http://www.w3.org/2000/svg" width="440" height="330" viewBox="0 0 440 330" role="img" aria-labelledby="title desc">
  <title id="title">AI courses</title>
  <desc id="desc">AI courses: video lessons from Python and the maths through deep learning and LLMs, to shipping RAG, evals and agents. First up: Python for AI. faydenai.com/learn</desc>
  <style>
    @keyframes bar { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.45); } }
    @keyframes twinkle { 0%, 100% { opacity: .35; transform: scale(.6) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }
    @keyframes spin { to { transform: rotate(90deg); } }
    .bar { transform-box: fill-box; transform-origin: center; animation: bar 1.3s ease-in-out infinite; }
    .tw { transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
    .tw2 { transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081124"/>
      <stop offset="1" stop-color="#0c1a36"/>
    </linearGradient>
    <linearGradient id="c-ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1f3f9"/>
      <stop offset=".35" stop-color="#b0c4e2"/>
      <stop offset=".7" stop-color="#519bcf"/>
      <stop offset="1" stop-color="#03eafb"/>
    </linearGradient>
    <pattern id="c-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#b0c4e2"/>
    </pattern>
    <radialGradient id="c-glow" cx="440" cy="0" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#519bcf" stop-opacity=".26"/>
      <stop offset="1" stop-color="#519bcf" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c-clip"><path d="M45,1 H417 Q439,1 439,23 V307 Q439,329 417,329 H23 Q1,329 1,307 V45 C1,16.4 16.4,1 45,1Z"/></clipPath>
  </defs>
  <g clip-path="url(#c-clip)">
    <rect width="440" height="330" fill="url(#c-bg)"/>
    <rect width="440" height="330" fill="url(#c-glow)"/>
    <rect width="440" height="330" fill="url(#c-dots)" opacity=".06"/>
    <rect x="0" y="326" width="440" height="4" fill="url(#c-ribbon)" opacity=".9"/>
  </g>
  <path d="M45,1 H417 Q439,1 439,23 V307 Q439,329 417,329 H23 Q1,329 1,307 V45 C1,16.4 16.4,1 45,1Z" fill="none" stroke="#b0c4e2" stroke-opacity=".2"/>

  <rect x="32" y="32" width="60" height="60" rx="16" fill="#ffffff" fill-opacity=".05" stroke="#b0c4e2" stroke-opacity=".25"/>
  <rect x="43" y="47" width="38" height="30" rx="7" fill="none" stroke="url(#c-ribbon)" stroke-width="2.5"/><path d="M49.8,49.8 L72.2,63.0 L49.8,76.2Z" fill="url(#c-ribbon)"/><path class="tw" d="M79,39 C80.26,44.74 80.26,44.74 86,46 C80.26,47.26 80.26,47.26 79,53 C77.74,47.26 77.74,47.26 72,46 C77.74,44.74 77.74,44.74 79,39Z" fill="#03eafb"/>
  

  <text x="32" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="-.5" fill="#f1f3f9">AI courses</text>
  <text x="32" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#b0c4e2">Video lessons, each with something to try.</text><text x="32" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#b0c4e2">From Python and the maths through deep learning</text><text x="32" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#b0c4e2">and LLMs, to shipping RAG, evals and agents.</text>
  <rect x="32.0" y="236" width="69.8" height="26" rx="13.0" fill="#ffffff" fill-opacity="0.05" stroke="#b0c4e2" stroke-opacity="0.22"/><text x="66.9" y="253.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#d3ddef">Python</text><rect x="109.8" y="236" width="77.4" height="26" rx="13.0" fill="#ffffff" fill-opacity="0.05" stroke="#b0c4e2" stroke-opacity="0.22"/><text x="148.4" y="253.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#d3ddef">PyTorch</text><rect x="195.1" y="236" width="54.5" height="26" rx="13.0" fill="#ffffff" fill-opacity="0.05" stroke="#b0c4e2" stroke-opacity="0.22"/><text x="222.4" y="253.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#d3ddef">LLMs</text><rect x="257.6" y="236" width="46.9" height="26" rx="13.0" fill="#ffffff" fill-opacity="0.05" stroke="#b0c4e2" stroke-opacity="0.22"/><text x="281.1" y="253.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#d3ddef">RAG</text><rect x="312.5" y="236" width="69.8" height="26" rx="13.0" fill="#ffffff" fill-opacity="0.05" stroke="#b0c4e2" stroke-opacity="0.22"/><text x="347.4" y="253.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#d3ddef">Agents</text>

  <line x1="32" y1="282" x2="408" y2="282" stroke="#b0c4e2" stroke-opacity=".14"/>
  <text x="32" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0db7e9">faydenai.com/learn ↗</text>
  <text x="408" y="308" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8facd2">First up: Python for AI</text>
</svg>
