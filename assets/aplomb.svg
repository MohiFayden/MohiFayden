<svg xmlns="http://www.w3.org/2000/svg" width="440" height="330" viewBox="0 0 440 330" role="img" aria-labelledby="title desc">
  <title id="title">Aplomb</title>
  <desc id="desc">Aplomb, live: an AI speaking coach for high-stakes moments. Bring a real pitch, interview or presentation and practise it out loud until you are ready. Android, iOS and web. withaplomb.ai</desc>
  <style>
    @keyframes bar { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.45); } }
    @keyframes twinkle { 0%, 100% { opacity: .35; transform: scale(.6) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }
    @keyframes spin { to { transform: rotate(90deg); } }
    .bar { transform-box: fill-box; transform-origin: center; animation: bar 1.3s ease-in-out infinite; }
    .tw { transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
    .tw2 { transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081124"/>
      <stop offset="1" stop-color="#0c1a36"/>
    </linearGradient>
    <linearGradient id="c-ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1f3f9"/>
      <stop offset=".35" stop-color="#b0c4e2"/>
      <stop offset=".7" stop-color="#519bcf"/>
      <stop offset="1" stop-color="#03eafb"/>
    </linearGradient>
    <pattern id="c-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#b0c4e2"/>
    </pattern>
    <radialGradient id="c-glow" cx="440" cy="0" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0db7e9" stop-opacity=".26"/>
      <stop offset="1" stop-color="#0db7e9" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c-clip"><path d="M45,1 H417 Q439,1 439,23 V307 Q439,329 417,329 H23 Q1,329 1,307 V45 C1,16.4 16.4,1 45,1Z"/></clipPath>
  </defs>
  <g clip-path="url(#c-clip)">
    <rect width="440" height="330" fill="url(#c-bg)"/>
    <rect width="440" height="330" fill="url(#c-glow)"/>
    <rect width="440" height="330" fill="url(#c-dots)" opacity=".06"/>
    <rect x="0" y="326" width="440" height="4" fill="url(#c-ribbon)" opacity=".9"/>
  </g>
  <path d="M45,1 H417 Q439,1 439,23 V307 Q439,329 417,329 H23 Q1,329 1,307 V45 C1,16.4 16.4,1 45,1Z" fill="none" stroke="#b0c4e2" stroke-opacity=".2"/>

  <rect x="32" y="32" width="60" height="60" rx="16" fill="#ffffff" fill-opacity=".05" stroke="#b0c4e2" stroke-opacity=".25"/>
  <rect class="bar" style="animation-delay:0.00s" x="44.0" y="55.2" width="5" height="13.7" rx="2.5" fill="url(#c-ribbon)"/><rect class="bar" style="animation-delay:0.17s" x="50.2" y="49.4" width="5" height="25.2" rx="2.5" fill="url(#c-ribbon)"/><rect class="bar" style="animation-delay:0.34s" x="56.4" y="44.0" width="5" height="36.0" rx="2.5" fill="url(#c-ribbon)"/><rect class="bar" style="animation-delay:0.51s" x="62.6" y="50.8" width="5" height="22.3" rx="2.5" fill="url(#c-ribbon)"/><rect class="bar" style="animation-delay:0.68s" x="68.8" y="46.5" width="5" height="31.0" rx="2.5" fill="url(#c-ribbon)"/><rect class="bar" style="animation-delay:0.85s" x="75.0" y="53.9" width="5" height="16.2" rx="2.5" fill="url(#c-ribbon)"/>
  
  <g>
    <rect x="330.8" y="34" width="77.2" height="28" rx="14" fill="#03eafb" fill-opacity=".08" stroke="#03eafb" stroke-opacity=".45"/>
    <circle cx="347.8" cy="48" r="7" fill="#03eafb" fill-opacity=".25"><animate attributeName="opacity" values=".1;1;.1" keyTimes="0;.5;1" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="347.8" cy="48" r="3.5" fill="#03eafb"/>
    <text x="360.8" y="52.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.6" fill="#03eafb">LIVE</text>
  </g>

  <text x="32" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="-.5" fill="#f1f3f9">Aplomb</text>
  <text x="32" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#b0c4e2">An AI speaking coach for high-stakes moments.</text><text x="32" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#b0c4e2">Bring a real pitch, interview or presentation,</text><text x="32" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#b0c4e2">and practise it out loud until you're ready.</text>
  <rect x="32.0" y="236" width="77.4" height="26" rx="13.0" fill="#ffffff" fill-opacity="0.05" stroke="#b0c4e2" stroke-opacity="0.22"/><text x="70.7" y="253.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#d3ddef">Android</text><rect x="117.4" y="236" width="46.9" height="26" rx="13.0" fill="#ffffff" fill-opacity="0.05" stroke="#b0c4e2" stroke-opacity="0.22"/><text x="140.8" y="253.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#d3ddef">iOS</text><rect x="172.2" y="236" width="46.9" height="26" rx="13.0" fill="#ffffff" fill-opacity="0.05" stroke="#b0c4e2" stroke-opacity="0.22"/><text x="195.7" y="253.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#d3ddef">Web</text><rect x="227.1" y="236" width="69.8" height="26" rx="13.0" fill="#ffffff" fill-opacity="0.05" stroke="#b0c4e2" stroke-opacity="0.22"/><text x="262.0" y="253.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#d3ddef">Claude</text><rect x="304.9" y="236" width="92.6" height="26" rx="13.0" fill="#ffffff" fill-opacity="0.05" stroke="#b0c4e2" stroke-opacity="0.22"/><text x="351.2" y="253.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#d3ddef">Speech AI</text>

  <line x1="32" y1="282" x2="408" y2="282" stroke="#b0c4e2" stroke-opacity=".14"/>
  <text x="32" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0db7e9">withaplomb.ai ↗</text>
  <text x="408" y="308" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8facd2">Kotlin MP + FastAPI</text>
</svg>
