<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-labelledby="title desc">
  <title id="title">Consulting: AI for your team</title>
  <desc id="desc">FaydenAI helps teams ship AI features: AI integration, model and provider strategy, internal tooling, architecture and review. Scoped tight, shipped fast.</desc>
  <style>
    @keyframes bar { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.45); } }
    @keyframes twinkle { 0%, 100% { opacity: .35; transform: scale(.6) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }
    @keyframes spin { to { transform: rotate(90deg); } }
    .bar { transform-box: fill-box; transform-origin: center; animation: bar 1.3s ease-in-out infinite; }
    .tw { transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
    .tw2 { transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081124"/>
      <stop offset="1" stop-color="#0c1a36"/>
    </linearGradient>
    <linearGradient id="c-ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1f3f9"/>
      <stop offset=".35" stop-color="#b0c4e2"/>
      <stop offset=".7" stop-color="#519bcf"/>
      <stop offset="1" stop-color="#03eafb"/>
    </linearGradient>
    <pattern id="c-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#b0c4e2"/>
    </pattern>
    <radialGradient id="c-glow" cx="900" cy="150" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#519bcf" stop-opacity=".24"/>
      <stop offset="1" stop-color="#519bcf" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c-clip"><path d="M41,1 H877 Q899,1 899,23 V127 Q899,149 877,149 H23 Q1,149 1,127 V41 C1,15.0 15.0,1 41,1Z"/></clipPath>
  </defs>
  <g clip-path="url(#c-clip)">
    <rect width="900" height="150" fill="url(#c-bg)"/>
    <rect width="900" height="150" fill="url(#c-glow)"/>
    <rect width="900" height="150" fill="url(#c-dots)" opacity=".06"/>
    <rect x="0" y="146" width="900" height="4" fill="url(#c-ribbon)" opacity=".9"/>
  </g>
  <path d="M41,1 H877 Q899,1 899,23 V127 Q899,149 877,149 H23 Q1,149 1,127 V41 C1,15.0 15.0,1 41,1Z" fill="none" stroke="#b0c4e2" stroke-opacity=".2"/>

  <rect x="32" y="32" width="72" height="72" rx="18" fill="#ffffff" fill-opacity=".05" stroke="#b0c4e2" stroke-opacity=".25"/>
  <line x1="68.0" y1="68.0" x2="52.2" y2="53.6" stroke="#b0c4e2" stroke-opacity=".6" stroke-width="2"/><line x1="68.0" y1="68.0" x2="83.8" y2="53.6" stroke="#b0c4e2" stroke-opacity=".6" stroke-width="2"/><line x1="68.0" y1="68.0" x2="52.2" y2="83.8" stroke="#b0c4e2" stroke-opacity=".6" stroke-width="2"/><line x1="68.0" y1="68.0" x2="83.8" y2="83.8" stroke="#b0c4e2" stroke-opacity=".6" stroke-width="2"/><circle cx="52.2" cy="53.6" r="4.5" fill="#d3ddef"/><circle cx="83.8" cy="53.6" r="4.5" fill="#d3ddef"/><circle cx="52.2" cy="83.8" r="4.5" fill="#d3ddef"/><circle cx="83.8" cy="83.8" r="4.5" fill="#d3ddef"/><path class="tw2" d="M68.0,58.0 C69.8,66.2 69.8,66.2 78.0,68.0 C69.8,69.8 69.8,69.8 68.0,78.0 C66.2,69.8 66.2,69.8 58.0,68.0 C66.2,66.2 66.2,66.2 68.0,58.0Z" fill="#03eafb"/>

  <text x="128" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="-.4" fill="#f1f3f9">AI for your team</text>
  <text x="128" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#b0c4e2">Consulting from FaydenAI. Scoped tight, shipped fast, built to hold up in production.</text>
  <rect x="128.0" y="100" width="130.8" height="26" rx="13.0" fill="#ffffff" fill-opacity="0.05" stroke="#b0c4e2" stroke-opacity="0.22"/><text x="193.4" y="117.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#d3ddef">AI integration</text><rect x="266.8" y="100" width="214.6" height="26" rx="13.0" fill="#ffffff" fill-opacity="0.05" stroke="#b0c4e2" stroke-opacity="0.22"/><text x="374.1" y="117.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#d3ddef">Model &amp; provider strategy</text><rect x="489.4" y="100" width="146.0" height="26" rx="13.0" fill="#ffffff" fill-opacity="0.05" stroke="#b0c4e2" stroke-opacity="0.22"/><text x="562.4" y="117.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#d3ddef">Internal tooling</text><rect x="643.4" y="100" width="184.1" height="26" rx="13.0" fill="#ffffff" fill-opacity="0.05" stroke="#b0c4e2" stroke-opacity="0.22"/><text x="735.4" y="117.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#d3ddef">Architecture &amp; review</text>

  <rect x="698" y="28" width="170" height="34" rx="17" fill="url(#c-ribbon)"/>
  <text x="783.0" y="50" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#081124">Get in touch ↗</text>
</svg>
